[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "1.0.0"
description = "Enterprise MCP Security Gateway & Deterministic Agent Firewall"
readme = "README.md"
authors = [{ name = "Google DeepMind Advanced Agentic Coding Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "sse-starlette>=1.6.0"
]

[project.scripts]
mcp-shield = "mcp_shield.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
